name: Renovate
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    if: github.repository == 'mamachanko/pink'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check Renovate credentials
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "$RENOVATE_TOKEN" ]]; then
            echo '::error::Set the RENOVATE_TOKEN repository secret; see docs/repository-setup.md.'
            exit 1
          fi
      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.247.2 # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
