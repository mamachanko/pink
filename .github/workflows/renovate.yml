name: Renovate
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    if: github.repository == 'mamachanko/pink'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run Renovate Docker image
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_USERNAME: github-actions[bot]
          RENOVATE_GIT_AUTHOR: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>
          LOG_LEVEL: info
        run: |
          docker run --rm \
            -e RENOVATE_TOKEN \
            -e RENOVATE_PLATFORM \
            -e RENOVATE_AUTODISCOVER \
            -e RENOVATE_REPOSITORIES \
            -e RENOVATE_ONBOARDING \
            -e RENOVATE_REQUIRE_CONFIG \
            -e RENOVATE_USERNAME \
            -e RENOVATE_GIT_AUTHOR \
            -e LOG_LEVEL \
            ghcr.io/renovatebot/renovate:44.247.2
