name: Verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-xcode26.2-${{ hashFiles('tools/**', 'scripts/bootstrap.sh', 'scripts/lint-tools.sh') }}
      - run: make bootstrap doctor verify
      - name: Fixed version release preparation
        run: node scripts/prepare.mjs 1.2.3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RefPaste-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
  required:
    name: Required verification
    if: always()
    needs: [native]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
