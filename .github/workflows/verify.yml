name: Verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-xcode26.2-${{ hashFiles('tools/**', 'scripts/bootstrap.sh', 'scripts/lint-tools.sh') }}
      - run: make bootstrap doctor verify
      - name: Verify keychain cleanup on signing failure
        run: bash scripts/test-signing-cleanup.sh
      - name: Audit published DMG identities
        run: bash scripts/audit-published.sh
      - name: Verify Homebrew cask
        run: bash scripts/test-homebrew.sh
      - name: Fixed version release preparation
        run: node scripts/prepare.mjs 1.2.3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: Pink-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
  readme:
    uses: ./.github/workflows/readme-images.yml
  required:
    name: Required verification
    if: always()
    needs: [native, readme]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NATIVE_RESULT: ${{ needs.native.result }}
          README_RESULT: ${{ needs.readme.result }}
        run: test "$NATIVE_RESULT" = success && test "$README_RESULT" = success
