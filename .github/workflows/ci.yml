name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'if (!/^(feat|fix|perf|docs|test|chore|ci|build|refactor|style|revert)(\([^)]+\))?!?: .+/.test(process.env.TITLE)) process.exit(1)'
