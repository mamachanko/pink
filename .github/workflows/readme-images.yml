name: README images
on:
  pull_request:
    paths:
      - 'App/**'
      - 'project.yml'
      - 'scripts/capture-readme.mjs'
      - '.github/workflows/readme-images.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-xcode26.2-${{ hashFiles('tools/**', 'scripts/bootstrap.sh', 'scripts/lint-tools.sh') }}
      - run: make bootstrap
      - run: node scripts/capture-readme.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Pink-readme-captures
          path: build/readme-captures/
          if-no-files-found: error
