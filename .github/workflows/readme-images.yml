name: README images
on:
  workflow_call:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-xcode26.2-${{ hashFiles('tools/**', 'scripts/bootstrap.sh', 'scripts/lint-tools.sh') }}
      - run: make bootstrap
      - run: node scripts/capture-readme.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        if: always()
        with:
          name: Pink-readme-captures
          path: build/readme-captures/
          if-no-files-found: error
