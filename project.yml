name: Pink
options:
  deploymentTarget:
    macOS: '15.0'
packages:
  Pink:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    PRODUCT_BUNDLE_IDENTIFIER: io.github.mamachanko.pink
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ARCHS: 'arm64 x86_64'
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: '$(PINK_VERSION)'
    CURRENT_PROJECT_VERSION: '$(PINK_BUILD)'
    PINK_VERSION: '0.0.0'
    PINK_BUILD: '1'
targets:
  Pink:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: Pink
        product: PinkCore
      - package: Pink
        product: PinkPlatform
    info:
      path: build/Info.plist
      properties:
        CFBundleIdentifier: io.github.mamachanko.pink
        CFBundleName: Pink
        CFBundleDisplayName: Pink
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        LSUIElement: true
        LSMinimumSystemVersion: '15.0'
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: 'MIT License; Copyright © 2026 Max Brauer'
        PinkCommit: '$(PINK_COMMIT)'
        CFBundleIconFile: Pink

  PinkReadmeCapture:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mamachanko.pink.readme
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: PINK_README_CAPTURE
    sources: [App]
    dependencies:
      - package: Pink
        product: PinkCore
      - package: Pink
        product: PinkPlatform
    info:
      path: build/ReadmeInfo.plist
      properties:
        CFBundleIdentifier: io.github.mamachanko.pink.readme
        CFBundleName: Pink
        CFBundleDisplayName: Pink
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        LSUIElement: true
        LSMinimumSystemVersion: '15.0'
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: 'MIT License; Copyright © 2026 Max Brauer'
        PinkCommit: '$(PINK_COMMIT)'
        CFBundleIconFile: Pink
